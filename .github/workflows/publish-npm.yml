# Trusted Publisher contract (sole npm trusted workflow — keep this filename):
#   file = publish-npm.yml
#   repo = yy-database/sql-studio
#   env  = NPM_PUBLISH
#
# Triggers:
#   - push tag v*              (e.g. v0.0.2 → dist-tag dev; v0.1.0 → beta)
#   - push tag placeholder-v*  (reserve names via stub publish)
#   - workflow_dispatch
# Real packages publish ONLY via this workflow (OIDC + provenance).
# Do not register Trusted Publisher on any other workflow file.

name: Publish npm

on:
  push:
    tags:
      - "v*"
      - "placeholder-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (required for workflow_dispatch)"
        required: false
        type: string
      mode:
        description: "publish | placeholder"
        required: false
        default: publish
        type: choice
        options:
          - publish
          - placeholder

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version / mode
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          mode="publish"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            v="${{ inputs.version }}"
            v="${v#v}"
            mode="${{ inputs.mode }}"
            if [[ -z "$v" ]]; then
              echo "inputs.version required for workflow_dispatch" >&2
              exit 1
            fi
          else
            ref="${GITHUB_REF#refs/tags/}"
            if [[ "$ref" == placeholder-v* ]]; then
              mode="placeholder"
              v="${ref#placeholder-v}"
            else
              v="${ref#v}"
            fi
            if [[ -z "$v" || "$v" == *"/"* ]]; then
              echo "could not parse version from GITHUB_REF=$GITHUB_REF" >&2
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "resolved version=$v mode=$mode"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Do NOT set registry-url: it writes _authToken and blocks OIDC.

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Pack check
        if: steps.ver.outputs.mode == 'publish'
        run: pnpm run pack:check

      - name: Strip token-style npmrc (OIDC only)
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "${HOME}/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc"; do
            [[ -n "${f}" && -f "${f}" ]] || continue
            if grep -q '_authToken' "${f}"; then
              grep -v '_authToken' "${f}" > "${f}.oidc" && mv "${f}.oidc" "${f}"
              echo "stripped _authToken from ${f}"
            fi
          done

      - name: Placeholder stubs (reserve names)
        if: steps.ver.outputs.mode == 'placeholder'
        run: node scripts/ci/publish-placeholder.mjs publish
        # First-time name creation usually needs a one-off laptop
        # `pnpm placeholder:publish` with .env.placeholder.local; CI OIDC
        # works after the package name exists and Trusted Publisher is set.

      - name: Publish real packages
        if: steps.ver.outputs.mode == 'publish'
        env:
          GITHUB_REF: refs/tags/v${{ steps.ver.outputs.version }}
        run: node scripts/ci/publish-npm.mjs --version=${{ steps.ver.outputs.version }}
