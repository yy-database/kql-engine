name: CI

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Pack check
        run: pnpm run pack:check

      - name: Export guard
        run: pnpm run export:guard

      - name: Unit tests
        run: pnpm test

      - name: Doctor smoke
        run: pnpm run sql -- doctor

      - name: Serve self-test
        run: pnpm run sql -- serve --port 0 --self-test

      - name: Probe round-trip
        run: pnpm run sql -- probe

      - name: ORM compile smoke
        run: pnpm run sql -- orm compile

      - name: CLI help smoke
        run: pnpm run sql -- --help
